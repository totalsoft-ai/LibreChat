# For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.2.5

# Cache settings: Set to true to enable caching
cache: false

# File strategy s3/firebase
# fileStrategy: "s3"
fileStrategy: "s3"

balance:
  enabled: true
  startBalance: 20000
  autoRefillEnabled: true
  refillIntervalValue: 1
  refillIntervalUnit: 'days'
  refillAmount: 20000 
  alertsEnabled: true

# Custom interface configuration
interface:
  customWelcome: "Hello {{user.name}}!"
  endpointsMenu: false
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true
  marketplace:
    use: true

modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - "agents"
    - "Local Models"
    - "PPM"
  list:
    - name: "Orchestrator"
      label: "Orchestrator"
      preset:
        endpoint: "Orchestrator"
        model: "orchestrator"

    - name: "assistant-with-knowledge"
      label: "Assistant with Knowledge"
      preset:
        endpoint: "Assistant-with-knowledge"
        model: "us.anthropic.claude-haiku-4-5-20251001-v1:0"

    - name: "file-search"
      label: "File Search"
      preset:
        endpoint: "Local Models"
        model: "gpt-5.6-luna"
        
#    - name: "assistant"
#      label: "Assistant"
#      preset:
#        endpoint: "Assistant"
#        model: "qwen3:8b"

        
 #  - name: "gpt-4o"
 #    label: "GPT-4o"
 #    preset:
 #      endpoint: "azureOpenAI"
 #      model: "gpt-4o"

 #  - name: "ppm"
 #    label: "PPM"
 #    preset:
 #      endpoint: "PPM"
 #      model: "gpt-5.6-luna"


# Example Actions Object Structure
actions:
  allowedDomains:
    - "swapi.dev"
    - "librechat.ai"
    - "google.com"


#mcpServers:
mcpServers:
  ppm-timesheet:
    type: streamable-http
    url: "${URL_PPM}" #http://localhost:8000/sse
    headers:
      Authorization: "{{LIBRECHAT_USER_ACCESS_TOKEN}}"

# Definition of custom endpoints
endpoints:
  assistants:
    disableBuilder: false # Disable Assistants Builder Interface by setting to `true`
    pollIntervalMs: 3000  # Polling interval for checking assistant updates
    timeoutMs: 180000  # Timeout for assistant operations
    # Should only be one or the other, either `supportedIds` or `excludedIds`
    supportedIds: ["asst_supportedAssistantId1", "asst_supportedAssistantId2"]
    # excludedIds: ["asst_excludedAssistantId"]
    # Only show assistants that the user created or that were created externally (e.g. in Assistants playground).
    # privateAssistants: false # Does not work with `supportedIds` or `excludedIds`
    # (optional) Models that support retrieval, will default to latest known OpenAI models that support the feature
    retrievalModels: ["gpt-4-turbo-preview"]
    # (optional) Assistant Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
    capabilities: ["code_interpreter", "retrieval", "actions", "tools", "image_vision"]
  agents:
    # (optional) Default recursion depth for agents, defaults to 25
    recursionLimit: 50
    # (optional) Max recursion depth for agents, defaults to 25
    maxRecursionLimit: 100
    # (optional) Disable the builder interface for agents
    disableBuilder: false
    # (optional) Agent Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
    capabilities: ["execute_code", "file_search", "actions", "tools", "artifacts"]
  azureOpenAI:
    # Endpoint-level configuration
    titleModel: 'gpt-5.6-luna'
    titleEndpoint: "Local Models"
    plugins: true
    assistants: false
    groups:
    # Group-level configuration
    - group: "${AZURE_OPENAI_INSTANCE}"
      apiKey: "${AZURE_OPENAI_API_KEY}" 
      instanceName: "${AZURE_OPENAI_INSTANCE}"
      version: "2025-01-01-preview"
      # Model-level configuration
      models:
        gpt-4o:
          deploymentName: gpt-4o
  bedrock:
    availableRegions:
      - "${BEDROCK_AWS_DEFAULT_REGION}"
    streamRate: 35
    titleModel: 'gpt-5.6-luna'
    titleEndpoint: "Local Models"
  custom:
    - name: "Assistant-with-knowledge"
      baseURL: "${ASSISTANT_WITH_K_BASEURL}"
      apiKey: "${ASSISTANT_WITH_K_APIKEY}"
      models:
        default: ["us.anthropic.claude-haiku-4-5-20251001-v1:0"]
      addParams:
        namespaces: "{{LIBRECHAT_USER_NAMESPACES}}"
      titleModel: 'gpt-5.6-luna'
      titleEndpoint: "Local Models"

    - name: "Local Models"
      # Azure OpenAI, same resource as the azureOpenAI endpoint (replaces the former Ollama server)
      baseURL: "https://${AZURE_OPENAI_INSTANCE}.openai.azure.com/openai/v1"
      apiKey: "${AZURE_OPENAI_API_KEY}"
      titleConvo: true
      titleModel: 'gpt-5.6-luna'
      titleEndpoint: "Local Models"
      models:
        default: ["gpt-5.6-luna"]
        fetch: false
      # GPT-5-family models reject non-default sampling params
      dropParams: ["temperature", "top_p"]
      streamRate: 35
      tokenConfig:
        "gpt-5.6-luna":
          prompt: 0
          completion: 0
    - name: "PPM"
      # Azure OpenAI, same resource as the azureOpenAI endpoint (replaces the former Ollama server)
      baseURL: "https://${AZURE_OPENAI_INSTANCE}.openai.azure.com/openai/v1"
      apiKey: "${AZURE_OPENAI_API_KEY}"
      models:
        default: ["gpt-5.6-luna"]
        fetch: false
      # GPT-5-family models reject non-default sampling params
      dropParams: ["temperature", "top_p"]
      titleModel: 'gpt-5.6-luna'
      titleEndpoint: "Local Models"
      tokenConfig:
        "gpt-5.6-luna":
          prompt: 0
          completion: 0

    - name: "Orchestrator"
      apiKey: "${ORCHESTRATOR_API_KEY}"
      baseURL: "${ORCHESTRATOR_URL}"
      models:
        default: ["orchestrator"]
        fetch: false
      addParams:
        namespaces: "{{LIBRECHAT_USER_NAMESPACES}}"
      headers:
        X-Access-Token: "{{LIBRECHAT_USER_ACCESS_TOKEN}}"
      titleConvo: true
      titleModel: 'gpt-5.6-luna'
      titleEndpoint: "Local Models"
      summarize: false
      forcePrompt: false
      capabilities: ["file_search", "context", "image_vision"]
      tokenConfig:
        "orchestrator":
          prompt: 0
          completion: 0

